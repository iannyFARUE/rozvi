{% if profile.avatar %}
<img
  src="{{ profile.avatar.url }}"
  alt="{{ profile.display_name }}"
  class="{{ classes }} shrink-0 rounded-full object-cover"
/>
{% else %}
<span class="{{ classes }} flex shrink-0 items-center justify-center rounded-full {{ profile.avatar_color }} font-semibold text-white">
  {{ profile.initials }}
</span>
{% endif %}
