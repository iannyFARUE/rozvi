{% extends 'blog/base.html' %}

{% block title %}Delete story — Rozvi{% endblock %}

{% block content %}
  <div class="mx-auto max-w-lg px-4 py-16 sm:px-6">
    <h1 class="font-serif text-3xl font-bold text-gray-900">Delete this story?</h1>
    <p class="mt-3 text-gray-600">
      This will permanently delete <span class="font-medium text-gray-900">"{{ post.title }}"</span>
      and all of its claps. This can't be undone.
    </p>

    <form method="post" action="" class="mt-8 flex items-center gap-4">
      {% csrf_token %}
      <button
        type="submit"
        class="rounded-full bg-red-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-red-700"
      >
        Delete story
      </button>
      <a
        href="{% url 'blog-post-detail' post.slug %}"
        class="text-sm font-medium text-gray-700 hover:text-gray-900 hover:underline"
      >
        Cancel
      </a>
    </form>
  </div>
{% endblock %}
