{% extends 'blog/base.html' %}

{% block title %}Password reset — Rozvi{% endblock %}

{% block content %}
  <div class="flex min-h-[70vh] items-center justify-center px-4 py-12 sm:px-6 text-center">
    <div class="w-full max-w-md">
      <h1 class="font-serif text-4xl font-bold text-gray-900">Password updated</h1>
      <p class="mt-3 text-gray-600">Your password has been set. You can now sign in with your new password.</p>
      <a
        href="{% url 'users-login' %}"
        class="mt-8 inline-block rounded-full bg-gray-900 px-6 py-3 text-sm font-medium text-white transition hover:bg-gray-700"
      >
        Sign in
      </a>
    </div>
  </div>
{% endblock %}
