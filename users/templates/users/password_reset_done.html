{% extends 'blog/base.html' %}

{% block title %}Check your email — Rozvi{% endblock %}

{% block content %}
  <div class="flex min-h-[70vh] items-center justify-center px-4 py-12 sm:px-6 text-center">
    <div class="w-full max-w-md">
      <h1 class="font-serif text-4xl font-bold text-gray-900">Check your email</h1>
      <p class="mt-3 text-gray-600">
        If an account exists for that email address, we've sent a link to reset your password.
      </p>
      <p class="mt-8 text-sm text-gray-500">
        <a href="{% url 'users-login' %}" class="font-medium text-gray-900 hover:underline">Back to sign in</a>
      </p>
    </div>
  </div>
{% endblock %}
